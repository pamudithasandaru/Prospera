name: Deploy Prospera to Windows Server

on:
  push:
    branches:
      - main

permissions:
  contents: read

defaults:
  run:
    shell: C:\Windows\System32\WindowsPowerShell\v1.0\powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "$ErrorActionPreference='Stop'; Get-Content -Raw -LiteralPath '{0}' | Invoke-Expression; if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }"

jobs:
  deploy:
    runs-on:
      - self-hosted
      - Windows
      - X64
      - prospera-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stop services
        run: |
          foreach ($name in "ProsperaAPI", "ProsperaML") {
            $svc = Get-Service -Name $name -ErrorAction SilentlyContinue
            if ($null -ne $svc -and $svc.Status -ne "Stopped") {
              Stop-Service -Name $name -Force
              $svc.WaitForStatus("Stopped", "00:00:30")
            }
          }

      - name: Copy source to deployment directory
        run: |
          $source = "${{ github.workspace }}"
          $destination = "C:\Prospera"

          robocopy $source $destination /MIR /R:2 /W:5 `
            /XD "$destination\.git" `
                "$destination\node_modules" `
                "$destination\client\node_modules" `
                "$destination\client\build" `
                "$destination\logs" `
                "$destination\ml-service\.venv" `
            /XF .env .env.production

          if ($LASTEXITCODE -gt 7) { exit $LASTEXITCODE }
          $global:LASTEXITCODE = 0

      - name: Install root dependencies
        run: |
          Set-Location C:\Prospera
          npm ci

      - name: Install frontend dependencies
        run: |
          Set-Location C:\Prospera\client
          npm ci

      - name: Build frontend
        env:
          CI: "false"
        run: |
          Set-Location C:\Prospera\client
          npm run build

      - name: Generate Prisma Client
        run: |
          Set-Location C:\Prospera
          npx prisma generate

      - name: Apply database migrations
        run: |
          Set-Location C:\Prospera
          npx prisma migrate deploy

      - name: Update ML dependencies
        run: |
          $ml = "C:\Prospera\ml-service"
          if (Test-Path "$ml\.venv\Scripts\python.exe") {
            & "$ml\.venv\Scripts\python.exe" -m pip install -r "$ml\requirements.txt" --quiet
          } else {
            Write-Host "No ML venv found; skipping."
          }

      - name: Start services
        run: |
          foreach ($name in "ProsperaML", "ProsperaAPI") {
            $svc = Get-Service -Name $name -ErrorAction SilentlyContinue
            if ($null -ne $svc) {
              Start-Service -Name $name
              $svc.WaitForStatus("Running", "00:00:30")
            }
          }
          Start-Sleep -Seconds 8

      - name: Check API health
        run: |
          $response = Invoke-WebRequest -Uri "http://localhost:5000/api/health" -UseBasicParsing -TimeoutSec 30
          if ($response.StatusCode -ne 200) { throw "API health check failed: $($response.StatusCode)" }
          Write-Host $response.Content

      - name: Check ML health
        run: |
          $svc = Get-Service -Name "ProsperaML" -ErrorAction SilentlyContinue
          if ($null -ne $svc) {
            $response = Invoke-WebRequest -Uri "http://localhost:8000/health" -UseBasicParsing -TimeoutSec 30
            if ($response.StatusCode -ne 200) { throw "ML health check failed: $($response.StatusCode)" }
            Write-Host $response.Content
          }