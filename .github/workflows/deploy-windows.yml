name: Deploy Prospera to Windows Server

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy:
    runs-on:
      - self-hosted
      - Windows
      - X64
      - prospera-production

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Stop services before file sync
        shell: C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Get-Content -Raw -LiteralPath '{0}' | Invoke-Expression"
        run: |
          # Stop-Service (not nssm) — the runner has PowerShell service perms
          # but not direct nssm OpenService() access.
          foreach ($name in "ProsperaAPI", "ProsperaML") {
            $svc = Get-Service -Name $name -ErrorAction SilentlyContinue
            if ($null -ne $svc -and $svc.Status -ne "Stopped") {
              Write-Host "Stopping service: $name (current status: $($svc.Status))"
              Stop-Service -Name $name -Force -ErrorAction SilentlyContinue
              try {
                $svc.WaitForStatus("Stopped", "00:00:20")
              } catch {
                Write-Host "WaitForStatus timed out or failed for $name; continuing."
              }
              Write-Host "$name is now $((Get-Service -Name $name).Status)"
            } else {
              Write-Host "$name already stopped or not found."
            }
          }
          Start-Sleep -Seconds 5

      - name: Copy source to deployment directory
        shell: C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Get-Content -Raw -LiteralPath '{0}' | Invoke-Expression"
        run: |
          $source = "${{ github.workspace }}"
          $destination = "C:\Prospera"

          robocopy $source $destination /MIR /R:2 /W:5 `
            /XD .git node_modules build .venv logs `
            /XF .env .env.production

          if ($LASTEXITCODE -gt 7) {
            exit $LASTEXITCODE
          }
          $global:LASTEXITCODE = 0

      - name: Install root dependencies
        shell: C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Get-Content -Raw -LiteralPath '{0}' | Invoke-Expression"
        run: |
          Set-Location C:\Prospera
          npm ci

      - name: Install frontend dependencies
        shell: C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Get-Content -Raw -LiteralPath '{0}' | Invoke-Expression"
        run: |
          Set-Location C:\Prospera\client
          npm ci

      - name: Build frontend
        shell: C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Get-Content -Raw -LiteralPath '{0}' | Invoke-Expression"
        env:
          CI: "false"
        run: |
          Set-Location C:\Prospera\client
          npm run build

      - name: Generate Prisma Client
        shell: C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Get-Content -Raw -LiteralPath '{0}' | Invoke-Expression"
        run: |
          Set-Location C:\Prospera
          npx prisma generate

      - name: Apply database migrations
        shell: C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Get-Content -Raw -LiteralPath '{0}' | Invoke-Expression"
        run: |
          Set-Location C:\Prospera
          npx prisma migrate deploy

      - name: Update ML dependencies
        shell: C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Get-Content -Raw -LiteralPath '{0}' | Invoke-Expression"
        run: |
          $ml = "C:\Prospera\ml-service"
          if (Test-Path "$ml\.venv\Scripts\python.exe") {
            & "$ml\.venv\Scripts\python.exe" -m pip install -r "$ml\requirements.txt" --quiet
          } else {
            Write-Host "No ML venv found; skipping."
          }

      - name: Start services
        shell: C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Get-Content -Raw -LiteralPath '{0}' | Invoke-Expression"
        run: |
          foreach ($name in "ProsperaML", "ProsperaAPI") {
            $svc = Get-Service -Name $name -ErrorAction SilentlyContinue
            if ($null -ne $svc) {
              Write-Host "Starting service: $name (current status: $($svc.Status))"
              if ($svc.Status -ne "Stopped") {
                Stop-Service -Name $name -Force -ErrorAction SilentlyContinue
                try { $svc.WaitForStatus("Stopped", "00:00:15") } catch {}
              }
              Start-Service -Name $name -ErrorAction SilentlyContinue
              try { $svc.WaitForStatus("Running", "00:00:20") } catch {}
              Write-Host "$name is now $((Get-Service -Name $name).Status)"
            } else {
              Write-Host "$name service not found; skipping."
            }
          }
          Start-Sleep -Seconds 8

      - name: Check API health
        shell: C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Get-Content -Raw -LiteralPath '{0}' | Invoke-Expression"
        run: |
          $healthy = $false
          $lastErr = ""
          for ($i = 1; $i -le 6; $i++) {
            try {
              $response = Invoke-WebRequest -Uri "http://localhost:5000/api/health" -UseBasicParsing -TimeoutSec 10
              if ($response.StatusCode -eq 200) {
                Write-Host "API Health Check Succeeded:"
                Write-Host $response.Content
                $healthy = $true
                break
              }
            } catch {
              $lastErr = $_.Exception.Message
              Write-Host "Health check attempt $i failed: $lastErr"
              Start-Sleep -Seconds 5
            }
          }

          if (-not $healthy) {
            Write-Host "=== API Health Check Failed ==="
            if (Test-Path "C:\Prospera\logs\api-error.log") {
              Write-Host "--- Tail of C:\Prospera\logs\api-error.log ---"
              Get-Content "C:\Prospera\logs\api-error.log" -Tail 30
            }
            if (Test-Path "C:\Prospera\logs\api-output.log") {
              Write-Host "--- Tail of C:\Prospera\logs\api-output.log ---"
              Get-Content "C:\Prospera\logs\api-output.log" -Tail 20
            }
            throw "API health check failed: $lastErr"
          }

      - name: Check ML health
        shell: C:\\Windows\\System32\\WindowsPowerShell\\v1.0\\powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "Get-Content -Raw -LiteralPath '{0}' | Invoke-Expression"
        run: |
          $service = Get-Service -Name "ProsperaML" -ErrorAction SilentlyContinue
          if ($null -ne $service) {
            $healthy = $false
            for ($i = 1; $i -le 5; $i++) {
              try {
                $response = Invoke-WebRequest -Uri "http://localhost:8000/health" -UseBasicParsing -TimeoutSec 10
                if ($response.StatusCode -eq 200) {
                  Write-Host "ML Health Check Succeeded:"
                  Write-Host $response.Content
                  $healthy = $true
                  break
                }
              } catch {
                Write-Host "ML Health check attempt $i failed: $($_.Exception.Message)"
                Start-Sleep -Seconds 3
              }
            }
            if (-not $healthy) {
              if (Test-Path "C:\Prospera\logs\ml-error.log") {
                Write-Host "--- Tail of C:\Prospera\logs\ml-error.log ---"
                Get-Content "C:\Prospera\logs\ml-error.log" -Tail 25
              }
              throw "ML health check failed."
            }
          } else {
            Write-Host "ProsperaML service is not installed; skipping."
          }